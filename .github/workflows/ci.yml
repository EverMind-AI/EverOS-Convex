name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # The component's convex codegen output (src/component/_generated) is
      # committed, so build + test run without a Convex backend or login.
      - run: npm ci
      - run: npm run build
      - run: npm test
