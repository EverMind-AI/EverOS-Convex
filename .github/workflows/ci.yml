name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token for every job: nothing in CI publishes or writes to the
# repo, so a compromised step gets no credential worth stealing.
permissions:
  contents: read

jobs:
  # A key committed anywhere in history is public the moment the repo is; the
  # local pre-publish sweep only happens when someone thinks of it.
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history — a secret in an old commit leaks just as well.
          fetch-depth: 0
      - name: Scan for committed secrets
        run: >
          docker run --rm -v "$PWD:/repo"
          zricethezav/gitleaks:v8.21.2
          detect --source /repo --no-banner

  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # The component's convex codegen output (src/component/_generated) is
      # committed, so build + test run without a Convex backend or login.
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run lint
      # The client's ComponentApi is hand-written, so nothing but this check
      # catches it drifting from the functions it describes: a new required
      # argument keeps compiling here and fails argument validation in every
      # consumer at runtime.
      - name: Typecheck the example against the built package
        run: |
          cd example
          npm ci
          npx tsc --noEmit -p convex/tsconfig.json
